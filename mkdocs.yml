site_name: MySQL Kata
site_url: https://abhishekmalvadkar.github.io/mysql-kata
repo_url: https://github.com/abhishekmalvadkar/mysql-kata
nav:
  - Home: index.md
  - Katas:
      - Customer Orders Overview: katas/customer-orders-overview/problem.md

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.top
    - navigation.instant
    - content.code.copy
    - content.action.edit
    - content.action.view
  palette:
    - scheme: default
      primary: blue
      accent: light blue

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - admonition
  - codehilite
  - pymdownx.extra
  - pymdownx.tabbed
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.details
